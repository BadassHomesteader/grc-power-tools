name: Build FluidAudio artifact

# swiftpm is broken on the dev machine (see scripts/bundle.sh), so FluidAudio
# (a normal SPM-only package) has to be built here instead. This workflow
# compiles vendor/fluidaudio-build into static libraries + a swiftmodule,
# harvests everything a downstream `swiftc` link needs, and uploads it as a
# build artifact for bundle.sh to download and link directly.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "vendor/fluidaudio-build/**"
      - ".github/workflows/build-fluidaudio-artifact.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # FluidAudio's manifest requires swift-tools-version 6.0 (Swift 6 / Xcode
      # 16+). The runner's default-selected Xcode can be older than the newest
      # one actually installed, so pick the highest-versioned Xcode explicitly
      # rather than trusting the image's default.
      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ] && [ -d /Applications/Xcode.app ]; then
            LATEST=/Applications/Xcode.app
          fi
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p
          uname -m

      - name: Build wrapper package (release)
        working-directory: vendor/fluidaudio-build
        run: swift build -c release --arch arm64 -v

      - name: Inspect .build layout (debug aid)
        working-directory: vendor/fluidaudio-build
        run: find .build -maxdepth 6 -type d | sort

      - name: Harvest artifact
        working-directory: vendor/fluidaudio-build
        run: |
          set -euo pipefail
          OUT=artifact
          rm -rf "$OUT"
          mkdir -p "$OUT/lib" "$OUT/modules" "$OUT/resources"

          echo "--- static libraries ---"
          find .build -name "*.a" -print -exec cp -v {} "$OUT/lib/" \;

          echo "--- swiftmodule-family files (only need PowerToolsASRBridge's) ---"
          find .build -type d -name "*.swiftmodule" -print -exec cp -Rv {} "$OUT/modules/" \;
          find .build -maxdepth 6 \( -name "PowerToolsASRBridge.swiftmodule" -o -name "PowerToolsASRBridge.swiftinterface" -o -name "PowerToolsASRBridge.private.swiftinterface" -o -name "PowerToolsASRBridge.swiftdoc" -o -name "PowerToolsASRBridge.swiftsourceinfo" -o -name "PowerToolsASRBridge.abi.json" \) -type f -print -exec cp -v {} "$OUT/modules/" \; || true

          echo "--- resource bundles, if any ---"
          find .build -maxdepth 6 -name "*.bundle" -print -exec cp -Rv {} "$OUT/resources/" \; || true

          echo "--- final artifact contents ---"
          find "$OUT" -type f | sort

          cd "$OUT" && zip -r ../PowerToolsASRBridge-artifact.zip . && cd ..
          ls -la PowerToolsASRBridge-artifact.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PowerToolsASRBridge-artifact
          path: vendor/fluidaudio-build/PowerToolsASRBridge-artifact.zip
          retention-days: 30
